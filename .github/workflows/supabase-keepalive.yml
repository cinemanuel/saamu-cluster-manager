name: Supabase keep-alive

# Supabase's free tier auto-pauses a project after 7 days with no API
# activity. This writes to a dedicated heartbeat row daily -- both changed
# from the original version, which pinged with a read-only SELECT every 3
# days. That version stayed green on every scheduled run and still didn't
# prevent the pause: last_pinged_at sat frozen at its original seed value
# for two weeks, because reads don't reliably register as activity for
# Supabase's pause detector the way a write does. Daily is extra safety
# margin now that a failure means more than "one skipped read." No paid
# services, no third-party actions: just curl, which every runner already
# has.

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch: {} # Allows a manual run from the Actions tab, e.g. to verify setup

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Update Supabase heartbeat table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # A SELECT against system_heartbeat (the previous version of this
          # step) kept the Action green but didn't actually keep the project
          # alive -- last_pinged_at proved reads weren't registering as real
          # database activity. Switched to a PATCH/UPDATE, writing the
          # current timestamp to the same row, which is unambiguously real
          # activity. Still can't touch anything but this one heartbeat row.
          #
          # Capture status and body separately (rather than curl -f) so a
          # failure prints what actually went wrong in the Actions log,
          # instead of just a bare exit code.
          response=$(curl -s -w "\n%{http_code}" \
            -X PATCH "$SUPABASE_URL/rest/v1/system_heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "HTTP status: $status"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Unexpected response body:"
            echo "$body"
            exit 1
          fi
