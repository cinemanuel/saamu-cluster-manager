name: Supabase keep-alive

# Supabase's free tier auto-pauses a project after 7 days with no API
# activity. This sends a minimal, read-only request every 3 days -- well
# inside that window -- so the project never sits idle long enough to
# trigger it. No paid services, no third-party actions: just curl against
# Supabase's Auth health endpoint, which every runner already has.

on:
  schedule:
    - cron: '0 6 */3 * *' # Every 3 days at 06:00 UTC
  workflow_dispatch: {} # Allows a manual run from the Actions tab, e.g. to verify setup

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase heartbeat table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The Auth health endpoint (/auth/v1/health) doesn't count as real
          # database activity for Supabase's pause detector, so it didn't
          # actually keep the project alive. Querying a dedicated
          # system_heartbeat table instead -- created specifically for this
          # purpose, readable by anon via RLS -- since that's real database
          # activity. Still strictly read-only.
          #
          # Capture status and body separately (rather than curl -f) so a
          # failure prints what actually went wrong in the Actions log,
          # instead of just a bare exit code.
          response=$(curl -s -w "\n%{http_code}" "$SUPABASE_URL/rest/v1/system_heartbeat?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "HTTP status: $status"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Unexpected response body:"
            echo "$body"
            exit 1
          fi
