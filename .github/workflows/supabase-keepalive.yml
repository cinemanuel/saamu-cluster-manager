name: Supabase keep-alive

# Supabase's free tier auto-pauses a project after 7 days with no API
# activity. This sends a minimal, read-only request every 3 days -- well
# inside that window -- so the project never sits idle long enough to
# trigger it. No paid services, no third-party actions: just curl against
# Supabase's own REST API (PostgREST), which every runner already has.

on:
  schedule:
    - cron: '0 6 */3 * *' # Every 3 days at 06:00 UTC
  workflow_dispatch: {} # Allows a manual run from the Actions tab, e.g. to verify setup

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Hits PostgREST's root path, not a table -- it returns the API's
          # own OpenAPI/schema document and only needs a valid apikey, so it
          # can't fail because of a table's RLS policies or grants (a table
          # query, e.g. /rest/v1/clusters, previously failed here because
          # anon has no SELECT grant on clusters -- clusters' RLS requires
          # is_admin(), which is never true for an unauthenticated request;
          # granting anon real access to app data just for a heartbeat isn't
          # worth it, so this avoids depending on table permissions at all).
          # Read-only either way: a GET can't modify data.
          #
          # Capture status and body separately (rather than curl -f) so a
          # failure prints what actually went wrong in the Actions log,
          # instead of just a bare exit code.
          response=$(curl -s -w "\n%{http_code}" "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "HTTP status: $status"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Unexpected response body:"
            echo "$body"
            exit 1
          fi
